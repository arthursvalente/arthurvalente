  <script>
    (function () {
      var colLeft = document.getElementById('colLeft');
      var colRight = document.getElementById('colRight');

      var globalIndex = 0;
      function renderColumn(target, entries) {
        var html = '';
        entries.forEach(function (entry) {
          var project = window.PROJECT_MAP[entry.slug];
          if (!project) return;
          var img = project.images[entry.image];
          if (!img) return;
          var isPriority = globalIndex < 2;
          var loadingAttr = isPriority ? 'eager' : 'lazy';
          var fetchAttr   = isPriority ? 'high' : 'low';
          var positionStyle = img.position ? ' style="object-position:' + img.position + ';"' : '';
          var aspectAttr = entry.aspect ? ' data-aspect="' + entry.aspect + '"' : '';
          // Prefer image's own alt (rich, descriptive); fall back to title + caption
          var altText = img.alt || (project.title + (img.caption ? ' · ' + img.caption : ''));
          var altEscaped = altText.replace(/"/g, '&quot;');
          html +=
            '<a class="project-card" href="project.html?slug=' + encodeURIComponent(project.slug) +
            '"' + aspectAttr + ' data-cursor="image" data-cursor-label="" data-reveal>' +
              '<div class="card-inner">' +
                '<div class="media">' +
                  '<img src="' + img.src + '" alt="' + altEscaped + '"' +
                    ' loading="' + loadingAttr + '" decoding="async" fetchpriority="' + fetchAttr + '"' +
                    positionStyle + '/>' +
                '</div>' +
                '<div class="project-meta">' +
                  '<p class="project-sub">' + project.client + '</p>' +
                  '<p class="project-title">' + project.title + '</p>' +
                '</div>' +
              '</div>' +
            '</a>';
          globalIndex++;
        });
        target.innerHTML = html;
      }

      renderColumn(colLeft, window.GRID.left);
      renderColumn(colRight, window.GRID.right);

      // Re-run reveal + lazy setup for freshly inserted elements
      var cards = document.querySelectorAll('.project-card');
      var io = new IntersectionObserver(function (entries) {
        entries.forEach(function (entry) {
          if (entry.isIntersecting) {
            entry.target.classList.add('visible');
            io.unobserve(entry.target);
          }
        });
      }, { threshold: 0.08, rootMargin: '0px 0px -40px 0px' });

      cards.forEach(function (card, i) {
        // Subtle staggered delay based on position in column
        var col = card.parentElement;
        var siblings = Array.prototype.slice.call(col.children);
        var localIdx = siblings.indexOf(card);
        card.style.transitionDelay = (Math.min(localIdx, 5) * 45) + 'ms';
        io.observe(card);

        var media = card.querySelector('.media');
        var img = media.querySelector('img');
        if (img.complete && img.naturalWidth > 0) {
          media.classList.add('loaded');
        } else {
          img.addEventListener('load', function () { media.classList.add('loaded'); }, { once: true });
          img.addEventListener('error', function () { media.classList.add('loaded'); }, { once: true });
        }
      });

      // ────────────────────────────────────────────────────────────────────
      // PER-CARD PARALLAX — each card has its own offset based on its
      // position in the viewport. Left column drifts one way, right the
      // other, but offset stays small per card (no accumulation across page).
      // ────────────────────────────────────────────────────────────────────
      var prefersReduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      var isCoarse = window.matchMedia('(pointer: coarse)').matches;
      if (!prefersReduced && !isCoarse) {
        var leftInners  = Array.from(document.querySelectorAll('.col-left  .card-inner'));
        var rightInners = Array.from(document.querySelectorAll('.col-right .card-inner'));
        var maxOffset = 40;     // max ± shift per card
        var rafId = null;

        function clamp(v, min, max) { return Math.max(min, Math.min(max, v)); }

        function tick() {
          var vh = window.innerHeight;
          var vhCenter = vh / 2;

          for (var i = 0; i < leftInners.length; i++) {
            var card = leftInners[i].parentElement;
            var rect = card.getBoundingClientRect();
            var centerY = rect.top + rect.height / 2;
            var progress = clamp((centerY - vhCenter) / vh, -1, 1);
            var off = (progress * maxOffset).toFixed(2);
            leftInners[i].style.transform = 'translate3d(0,' + off + 'px,0)';
          }
          for (var j = 0; j < rightInners.length; j++) {
            var card2 = rightInners[j].parentElement;
            var rect2 = card2.getBoundingClientRect();
            var centerY2 = rect2.top + rect2.height / 2;
            var progress2 = clamp((centerY2 - vhCenter) / vh, -1, 1);
            var off2 = (-progress2 * maxOffset).toFixed(2);
            rightInners[j].style.transform = 'translate3d(0,' + off2 + 'px,0)';
          }
          rafId = null;
        }

        function schedule() {
          if (!rafId) rafId = requestAnimationFrame(tick);
        }

        window.addEventListener('scroll', schedule, { passive: true });
        window.addEventListener('resize', schedule, { passive: true });
        tick(); // initial position
      }
    })();
  </script>
