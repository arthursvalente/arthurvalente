  <style>
    .nf-main {
      min-height: calc(100vh - 200px);
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      justify-content: center;
      padding: 180px var(--pad-x-desktop) 100px;
      max-width: 900px;
    }
    .nf-code {
      font-size: 10px;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 28px;
      opacity: 0; transform: translateY(10px);
      animation: fadeUp 0.9s var(--ease-out-expo) 0.1s forwards;
    }
    .nf-h1 {
      font-size: clamp(22px, 2.5vw, 32px);
      font-weight: 300;
      line-height: 1.3;
      letter-spacing: -0.005em;
      max-width: 32ch;
      margin-bottom: 40px;
      opacity: 0; transform: translateY(14px);
      animation: fadeUp 1s var(--ease-out-expo) 0.22s forwards;
    }
    .nf-back {
      display: inline-flex; align-items: center; gap: 14px;
      font-size: 11px; letter-spacing: 0.22em; text-transform: uppercase;
      color: var(--ink);
      opacity: 0; transform: translateY(10px);
      animation: fadeUp 0.9s var(--ease-out-expo) 0.4s forwards;
      transition: gap var(--t-mid) var(--ease-out-cubic);
    }
    .nf-back:hover { gap: 22px; }
    .nf-back .arrow {
      display: inline-block;
      width: 22px; height: 1px;
      background: currentColor;
      position: relative;
      transition: width var(--t-mid) var(--ease-out-cubic);
    }
    .nf-back .arrow::after {
      content: '';
      position: absolute;
      left: 0; top: 50%;
      width: 7px; height: 7px;
      border-left: 1px solid currentColor;
      border-bottom: 1px solid currentColor;
      transform: translateY(-50%) rotate(45deg);
    }
    .nf-back:hover .arrow { width: 32px; }
    @media (max-width: 768px) {
      .nf-main { padding: 130px var(--pad-x-mobile) 60px; }
    }
  </style>
</head>
